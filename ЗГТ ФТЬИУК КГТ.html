<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amber Run — Платформер</title>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root {
    --bg: #0d1117; --fg: #f0e6d3; --accent: #ff6b2b; --accent2: #ffc857;
    --card: rgba(20,28,40,0.85); --border: rgba(255,107,43,0.25);
    --danger: #e63946; --health: #2ec4b6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--fg); font-family: 'Nunito', sans-serif;
    overflow: hidden; height: 100vh; width: 100vw; display: flex;
    align-items: center; justify-content: center;
  }
  #gameWrapper { 
    position: relative; 
    width: min(100vw, 177.78vh); 
    height: min(56.25vw, 100vh); 
    aspect-ratio: 16/9;
  }
  canvas {
    display: block; width: 100%; height: 100%; border-radius: 12px;
    box-shadow: 0 0 60px rgba(255,107,43,0.15), 0 0 120px rgba(255,107,43,0.05);
  }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; background: rgba(13,17,23,0.92);
    backdrop-filter: blur(12px); border-radius: 12px; z-index: 10; transition: opacity 0.4s;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlay h1 {
    font-family: 'Russo One', sans-serif; font-size: clamp(2rem, 6vw, 3.5rem);
    color: var(--accent); text-shadow: 0 0 30px rgba(255,107,43,0.4);
    margin-bottom: 8px; letter-spacing: 2px;
  }
  #overlay .subtitle { font-size: clamp(0.85rem, 2vw, 1.1rem); color: rgba(240,230,211,0.6); margin-bottom: 32px; }
  #overlay .stats { font-size: 1.1rem; color: var(--accent2); margin-bottom: 8px; font-weight: 700; }
  .btn {
    font-family: 'Russo One', sans-serif; font-size: clamp(0.9rem, 2.5vw, 1.15rem);
    padding: 14px 48px; border: 2px solid var(--accent); background: transparent;
    color: var(--accent); border-radius: 8px; cursor: pointer; transition: all 0.25s;
    margin-top: 16px; letter-spacing: 1px;
  }
  .btn:hover {
    background: var(--accent); color: var(--bg);
    box-shadow: 0 0 30px rgba(255,107,43,0.35); transform: translateY(-2px);
  }
  .btn.secondary { border-color: var(--accent2); color: var(--accent2); }
  .btn.secondary:hover { background: var(--accent2); color: var(--bg); box-shadow: 0 0 30px rgba(255,200,87,0.35); }
  .btn.danger { border-color: var(--danger); color: var(--danger); }
  .btn.danger:hover { background: var(--danger); color: var(--bg); box-shadow: 0 0 30px rgba(230,57,70,0.35); }
  .btn.green { border-color: #2ec4b6; color: #2ec4b6; }
  .btn.green:hover { background: #2ec4b6; color: var(--bg); box-shadow: 0 0 30px rgba(46,196,182,0.35); }
  .controls-hint { margin-top: 24px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .controls-hint span {
    background: var(--card); border: 1px solid var(--border); padding: 6px 14px;
    border-radius: 6px; font-size: 0.85rem; color: rgba(240,230,211,0.7);
  }
  .controls-hint span kbd { color: var(--accent2); font-weight: 900; font-family: 'Russo One', sans-serif; }
  #mobileControls {
    display: none; position: absolute; bottom: 12px; left: 12px; right: 12px;
    z-index: 5; justify-content: space-between; pointer-events: none;
  }
  .mobile-group { display: flex; gap: 8px; pointer-events: auto; }
  .m-btn {
    width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--accent);
    background: rgba(13,17,23,0.7); color: var(--accent); font-size: 1.2rem;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    -webkit-tap-highlight-color: transparent; user-select: none;
  }
  .m-btn:active { background: var(--accent); color: var(--bg); }
  .m-btn.jump { width: 64px; height: 64px; border-color: var(--accent2); color: var(--accent2); }
  .m-btn.jump:active { background: var(--accent2); color: var(--bg); }
  .m-btn.dash { border-color: #2ec4b6; color: #2ec4b6; }
  .m-btn.dash:active { background: #2ec4b6; color: var(--bg); }
  .m-btn.shoot { border-color: #e63946; color: #e63946; font-size: 1rem; }
  .m-btn.shoot:active { background: #e63946; color: var(--bg); }
  #pauseOverlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; background: rgba(13,17,23,0.92);
    backdrop-filter: blur(12px); border-radius: 12px; z-index: 15; transition: opacity 0.3s;
  }
  #pauseOverlay.hidden { opacity: 0; pointer-events: none; }
  #pauseOverlay h2 {
    font-family: 'Russo One', sans-serif; font-size: clamp(1.5rem, 4vw, 2.5rem);
    color: var(--accent); margin-bottom: 24px; letter-spacing: 2px;
  }
  #pauseOverlay .record-display {
    font-size: clamp(0.9rem, 2vw, 1.1rem);
    color: var(--accent2); margin-bottom: 16px;
    padding: 8px 24px; background: var(--card); border-radius: 8px;
    border: 1px solid var(--border);
  }
  .pause-buttons {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    width: 100%; max-width: 300px;
  }
  .pause-buttons .btn {
    width: 100%; margin-top: 0; padding: 12px 24px;
    font-size: clamp(0.8rem, 1.8vw, 1rem);
  }
  .version-info {
    position: absolute; bottom: 16px; right: 24px;
    font-size: 0.7rem; color: rgba(240,230,211,0.3);
    font-family: 'Nunito', sans-serif;
  }
  .toast {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--accent2); color: var(--accent2);
    padding: 10px 24px; border-radius: 8px; font-weight: 700; z-index: 20;
    opacity: 0; transition: opacity 0.3s; pointer-events: none;
    text-align: center; max-width: 90%;
  }
  .toast.show { opacity: 1; }
  @media (pointer: coarse) { #mobileControls { display: flex; } }
</style>
</head>
<body>

<div id="gameWrapper">
  <canvas id="gameCanvas"></canvas>

  <div id="overlay">
    <h1 id="overlayTitle">Amber RUN</h1>
    <div class="subtitle" id="overlaySubtitle">Процедурный платформер</div>
    <div class="stats" id="overlayStats" style="display:none"></div>
    <button class="btn" id="startBtn">НАЧАТЬ ИГРУ</button>
    <div class="controls-hint">
      <span><kbd>A/D</kbd> Движение</span>
      <span><kbd>SPACE</kbd> Прыжок</span>
      <span><kbd>SHIFT</kbd> Рывок</span>
      <span><kbd>F</kbd> Выстрел</span>
      <span><kbd>ESC</kbd> Меню</span>
    </div>
  </div>

  <div id="pauseOverlay" class="hidden">
    <h2>ПАУЗА</h2>
    <div class="record-display" id="recordDisplay">🏆 Рекорд: 0</div>
    <div class="pause-buttons">
      <button class="btn green" id="resumeBtn">▶ ПРОДОЛЖИТЬ</button>
      <button class="btn secondary" id="restartBtn">🔄 ЗАНОВО</button>
      <button class="btn secondary" id="fullscreenBtn">⛶ ПОЛНЫЙ ЭКРАН</button>
      <button class="btn secondary" id="downloadBtn">💾 СКАЧАТЬ ИГРУ</button>
      <button class="btn danger" id="liteBtn">📦 ВЕРСИЯ LITE</button>
    </div>
    <div class="version-info">v2.0 — Enhanced Edition</div>
  </div>

  <div class="toast" id="toast"></div>

  <div id="mobileControls">
    <div class="mobile-group">
      <button class="m-btn" id="mLeft"><i class="fas fa-arrow-left"></i></button>
      <button class="m-btn" id="mRight"><i class="fas fa-arrow-right"></i></button>
      <button class="m-btn shoot" id="mShoot"><i class="fas fa-fire"></i></button>
      <button class="m-btn dash" id="mDash"><i class="fas fa-bolt"></i></button>
    </div>
    <div class="mobile-group">
      <button class="m-btn jump" id="mJump"><i class="fas fa-arrow-up"></i></button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = 960, H = 540;
canvas.width = W; canvas.height = H;

// ===================== СИСТЕМА РЕКОРДОВ =====================
function getBestScore() {
  try {
    return parseInt(localStorage.getItem('AmberRunBestScore')) || 0;
  } catch(e) {
    return 0;
  }
}

function setBestScore(score) {
  try {
    localStorage.setItem('AmberRunBestScore', String(score));
  } catch(e) {
    // ignore
  }
}

let bestScore = getBestScore();

const COLORS = {
  mountain1: '#1a1425', mountain2: '#261b35',
  platform: '#3d2e1f', platformTop: '#6b5234', platformEdge: '#8b6e4e', grass: '#3d7a3a',
  playerBody: '#ff6b2b', playerLight: '#ffa366', playerDark: '#cc4400',
  glow: 'rgba(255, 107, 43, 0.4)',
  eye: '#fff', pupil: '#1a1a2e',
  coin: '#ffc857', coinShine: '#fff5d6',
  enemySlime: '#e63946', enemySlimeDark: '#b02a34',
  enemyBat: '#9b59b6', enemyBatDark: '#7d3c98',
  enemySpikes: '#888',
  healthFull: '#2ec4b6', healthEmpty: '#3a3a4a',
  healthPickup: '#ff4466',
  particleFire: '#ff6b2b', particleCoin: '#ffc857', particleHurt: '#e63946',
  particleJump: '#ffffff', particleDash: '#2ec4b6',
  text: '#f0e6d3',
  sunsetColors: ['#ff6b2b', '#ff8833', '#ffaa44', '#ffcc55', '#ff4466', '#cc3377', '#ff3377']
};

let gameState = 'menu';
let score = 0, coins = 0, distance = 0;
let combo = 0;
let maxCombo = 0;

// ===================== ПЕРЕМЕННАЯ ДЛЯ ВЕРСИИ LITE =====================
let isLiteVersion = false;

const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD','ShiftLeft','ShiftRight','KeyF','Escape'].includes(e.code)) e.preventDefault();
  if (e.code === 'Escape') {
    if (gameState === 'playing') pauseGame();
    else if (gameState === 'paused') resumeGame();
  }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

const mobileKeys = { left: false, right: false, jump: false, dash: false, shoot: false };
function setupMobileBtn(id, key) {
  const el = document.getElementById(id);
  const start = () => { mobileKeys[key] = true; };
  const end = () => { mobileKeys[key] = false; };
  el.addEventListener('touchstart', e => { e.preventDefault(); start(); });
  el.addEventListener('touchend', e => { e.preventDefault(); end(); });
  el.addEventListener('mousedown', start);
  el.addEventListener('mouseup', end);
  el.addEventListener('mouseleave', end);
}
setupMobileBtn('mLeft', 'left');
setupMobileBtn('mRight', 'right');
setupMobileBtn('mJump', 'jump');
setupMobileBtn('mDash', 'dash');
setupMobileBtn('mShoot', 'shoot');

function isLeft() { return keys['KeyA'] || keys['ArrowLeft'] || mobileKeys.left; }
function isRight() { return keys['KeyD'] || keys['ArrowRight'] || mobileKeys.right; }
function isJump() { return keys['Space'] || keys['KeyW'] || keys['ArrowUp'] || mobileKeys.jump; }
function isDash() { return keys['ShiftLeft'] || keys['ShiftRight'] || mobileKeys.dash; }
function isShoot() { return keys['KeyF'] || mobileKeys.shoot; }

// ===================== ПАУЗА И МЕНЮ =====================
const pauseOverlay = document.getElementById('pauseOverlay');
const resumeBtn = document.getElementById('resumeBtn');
const restartBtn = document.getElementById('restartBtn');
const downloadBtn = document.getElementById('downloadBtn');
const fullscreenBtn = document.getElementById('fullscreenBtn');
const liteBtn = document.getElementById('liteBtn');
const recordDisplay = document.getElementById('recordDisplay');
const toastEl = document.getElementById('toast');

function updateRecordDisplay() {
  const currentBest = getBestScore();
  recordDisplay.textContent = `🏆 Рекорд: ${currentBest}`;
}

function pauseGame() {
  if (gameState === 'playing' || gameState === 'dead') {
    gameState = 'paused';
    updateRecordDisplay();
    pauseOverlay.classList.remove('hidden');
  }
}

function resumeGame() {
  if (gameState === 'paused') {
    gameState = 'playing';
    pauseOverlay.classList.add('hidden');
  }
}

resumeBtn.addEventListener('click', resumeGame);

restartBtn.addEventListener('click', () => {
  pauseOverlay.classList.add('hidden');
  startGame();
});

// ===================== СКАЧИВАНИЕ ИГРЫ =====================
downloadBtn.addEventListener('click', function() {
  // Получаем текущий HTML документа
  const doctype = '<!DOCTYPE html>\n';
  const html = doctype + document.documentElement.outerHTML;
  const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  
  // Создаём ссылку для скачивания
  const a = document.createElement('a');
  a.href = url;
  a.download = 'Amber-run-play.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  
  showToast('✅ Игра сохранена как Amber-run-play.html');
});

// ===================== ПОЛНЫЙ ЭКРАН =====================
function enterFullscreen() {
  const elem = document.documentElement;
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    if (elem.requestFullscreen) {
      elem.requestFullscreen().catch(err => console.log(err));
    } else if (elem.webkitRequestFullscreen) {
      elem.webkitRequestFullscreen();
    } else if (elem.msRequestFullscreen) {
      elem.msRequestFullscreen();
    }
  }
}
fullscreenBtn.addEventListener('click', enterFullscreen);

// ===================== ВЕРСИЯ LITE =====================
liteBtn.addEventListener('click', function() {
  if (confirm('Переключиться на версию Lite?\n\nОна содержит базовый геймплей без улучшенных эффектов.')) {
    isLiteVersion = !isLiteVersion;
    if (isLiteVersion) {
      showToast('📦 Включена версия Lite (базовые эффекты)');
      liteBtn.textContent = '✨ ВЕРСИЯ FULL';
      liteBtn.className = 'btn green';
    } else {
      showToast('✨ Включена версия Full (улучшенные эффекты)');
      liteBtn.textContent = '📦 ВЕРСИЯ LITE';
      liteBtn.className = 'btn danger';
    }
    // Перезапускаем игру для применения изменений
    if (gameState === 'playing' || gameState === 'paused' || gameState === 'dead') {
      startGame();
    }
  }
});

// ===================== TOAST =====================
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 4000);
}

// ===================== КАМЕРА =====================
const camera = { x: 0, y: 0, targetX: 0, targetY: 0, shake: 0 };
function updateCamera(pl) {
  camera.targetX = pl.x - W * 0.35;
  camera.targetY = pl.y - H * 0.5;
  camera.targetY = Math.min(camera.targetY, 100);
  camera.targetY = Math.max(camera.targetY, -200);
  camera.x += (camera.targetX - camera.x) * 0.08;
  camera.y += (camera.targetY - camera.y) * 0.06;
  if (camera.shake > 0) camera.shake *= 0.9;
  if (camera.shake < 0.5) camera.shake = 0;
}
function getShakeOffset() {
  if (camera.shake <= 0) return { x: 0, y: 0 };
  return { x: (Math.random() - 0.5) * camera.shake * 2, y: (Math.random() - 0.5) * camera.shake * 2 };
}

// ===================== ЧАСТИЦЫ =====================
let particles = [];
class Particle {
  constructor(x, y, vx, vy, color, life, size, gravity) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.color = color; this.life = life; this.maxLife = life;
    this.size = size; this.gravity = gravity || 0;
  }
  update() { this.x += this.vx; this.y += this.vy; this.vy += this.gravity; this.life--; }
  draw() {
    const alpha = Math.max(0, this.life / this.maxLife);
    const s = this.size * alpha;
    ctx.globalAlpha = alpha; ctx.fillStyle = this.color;
    ctx.beginPath(); ctx.arc(this.x - camera.x, this.y - camera.y, Math.max(0.5, s), 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
}
function spawnParticles(x, y, color, count, speed, life, size, gravity) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2; const spd = Math.random() * speed;
    particles.push(new Particle(x, y, Math.cos(angle) * spd, Math.sin(angle) * spd, color, life + Math.random() * life * 0.5, size * (0.5 + Math.random()), gravity || 0));
  }
}

// ===================== ПАРЯЩИЕ ЧАСТИЦЫ (только в Full версии) =====================
let floatingParticles = [];

function createFloatingParticles() {
  floatingParticles = [];
  const colors = ['#ffd700', '#ffaa44', '#ff6b2b', '#ffcc55', '#ff4466', '#ff88aa', '#ffdd88'];
  for (let i = 0; i < 50; i++) {
    floatingParticles.push({
      x: Math.random() * W * 4,
      y: Math.random() * H * 0.8 + 20,
      size: 1 + Math.random() * 3,
      speedX: (Math.random() - 0.5) * 0.5,
      speedY: (Math.random() - 0.5) * 0.3,
      phase: Math.random() * Math.PI * 2,
      speed: 0.5 + Math.random() * 1.5,
      color: colors[Math.floor(Math.random() * colors.length)],
      alpha: 0.2 + Math.random() * 0.5,
      twinkleSpeed: 0.02 + Math.random() * 0.04,
      drift: Math.random() * Math.PI * 2
    });
  }
}
createFloatingParticles();

function updateFloatingParticles() {
  if (isLiteVersion) return;
  for (const fp of floatingParticles) {
    fp.x += fp.speedX + Math.sin(fp.drift) * 0.2;
    fp.y += fp.speedY + Math.cos(fp.drift * 0.7) * 0.1;
    fp.drift += 0.01;
    fp.phase += fp.twinkleSpeed;
    fp.x -= 0.3 + Math.sin(fp.drift * 0.5) * 0.1;
    if (fp.x < -50) fp.x = W * 3 + Math.random() * 200;
    if (fp.x > W * 3 + 50) fp.x = -50;
    if (fp.y < -20) fp.y = H * 0.8 + 20;
    if (fp.y > H * 0.8 + 20) fp.y = -20;
  }
}

function drawFloatingParticles() {
  if (isLiteVersion) return;
  for (const fp of floatingParticles) {
    const sx = fp.x - camera.x * 0.3;
    const sy = fp.y - camera.y * 0.2;
    if (sx < -50 || sx > W + 50) continue;
    if (sy < -50 || sy > H + 50) continue;
    const alpha = fp.alpha * (0.6 + Math.sin(fp.phase) * 0.4);
    const size = fp.size * (0.8 + Math.sin(fp.phase * 0.7) * 0.2);
    ctx.globalAlpha = alpha * 0.3;
    const grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, size * 4);
    grad.addColorStop(0, fp.color);
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(sx, sy, size * 4, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = alpha * 0.8;
    ctx.fillStyle = fp.color;
    ctx.beginPath(); ctx.arc(sx, sy, size, 0, Math.PI * 2); ctx.fill();
    if (size > 1.5) {
      ctx.globalAlpha = alpha * 0.6;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(sx - size * 0.2, sy - size * 0.2, size * 0.3, 0, Math.PI * 2); ctx.fill();
    }
    if (size > 2 && Math.sin(fp.phase) > 0.5) {
      ctx.globalAlpha = alpha * 0.2;
      ctx.strokeStyle = fp.color;
      ctx.lineWidth = 0.5;
      for (let i = 0; i < 4; i++) {
        const angle = (i / 4) * Math.PI * 2 + fp.phase * 0.5;
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(sx + Math.cos(angle) * size * 2.5, sy + Math.sin(angle) * size * 2.5);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }
}

// ===================== СНАРЯДЫ =====================
let projectiles = [];
class Projectile {
  constructor(x, y, dir) {
    this.x = x; this.y = y; this.dir = dir;
    this.speed = 12; this.radius = 6; this.life = 60;
    this.trail = [];
  }
  update() {
    this.x += this.speed * this.dir;
    this.life--;
    this.trail.push({ x: this.x, y: this.y, life: 8 });
    if (this.trail.length > 10) this.trail.shift();
    if (this.life % 2 === 0) spawnParticles(this.x, this.y, COLORS.particleFire, 1, 2, 8, 3, 0);
    for (const e of enemies) {
      if (!e.alive) continue;
      const dx = this.x - e.x, dy = this.y - e.y;
      if (Math.sqrt(dx * dx + dy * dy) < 20) {
        e.alive = false; this.life = 0;
        combo++;
        if (combo > maxCombo) maxCombo = combo;
        const bonus = Math.floor(combo / 5) * 10;
        score += 25 + bonus;
        spawnParticles(e.x, e.y, e.type === 'slime' ? COLORS.enemySlime : (e.type === 'bat' ? COLORS.enemyBat : '#888'), 15, 5, 25, 4, 0.15);
        spawnParticles(this.x, this.y, COLORS.particleFire, 10, 4, 15, 3, 0);
        camera.shake = 3;
        if (combo > 0 && combo % 5 === 0) showToast(`🔥 КОМБО x${Math.floor(combo/5)+1}!`);
        break;
      }
    }
    for (const p of platforms) {
      if (p.destroyed) continue;
      if (this.x > p.x && this.x < p.x + p.w && this.y > p.y && this.y < p.y + p.h) {
        this.life = 0; spawnParticles(this.x, this.y, COLORS.particleFire, 6, 3, 12, 2, 0); break;
      }
    }
  }
  draw() {
    for (let i = 0; i < this.trail.length; i++) {
      const t = this.trail[i]; const alpha = (i / this.trail.length) * 0.4;
      ctx.globalAlpha = alpha; ctx.fillStyle = COLORS.particleFire;
      ctx.beginPath(); ctx.arc(t.x - camera.x, t.y - camera.y, this.radius * (i / this.trail.length), 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    const sx = this.x - camera.x, sy = this.y - camera.y;
    ctx.globalAlpha = 0.3; ctx.fillStyle = '#ff4400';
    ctx.beginPath(); ctx.arc(sx, sy, this.radius * 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1; ctx.fillStyle = '#ffaa33';
    ctx.beginPath(); ctx.arc(sx, sy, this.radius, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff8e0';
    ctx.beginPath(); ctx.arc(sx - 1, sy - 1, this.radius * 0.4, 0, Math.PI * 2); ctx.fill();
  }
}

// ===================== ИГРОК =====================
const player = {
  x: 200, y: 300, vx: 0, vy: 0, w: 28, h: 36,
  onGround: false, jumps: 0, maxJumps: 2,
  hp: 5, maxHp: 5, invincible: 0, facing: 1,
  animFrame: 0, animTimer: 0, running: false,
  jumpPressed: false, dead: false, trail: [],
  dashing: false, dashTimer: 0, dashDuration: 8, dashSpeed: 18,
  dashCooldown: 0, dashCooldownMax: 90, dashPressed: false, dashTrail: [],
  shootCooldown: 0, shootCooldownMax: 25, shootPressed: false,
  glowParticles: [],
};

function resetPlayer() {
  player.x = 200; player.y = 200; player.vx = 0; player.vy = 0;
  player.onGround = false; player.jumps = 0;
  player.hp = player.maxHp; player.invincible = 0;
  player.facing = 1; player.dead = false; player.trail = [];
  player.jumpPressed = false;
  player.dashing = false; player.dashTimer = 0; player.dashCooldown = 0;
  player.dashPressed = false; player.dashTrail = [];
  player.shootCooldown = 0; player.shootPressed = false;
  player.glowParticles = [];
  combo = 0; maxCombo = 0;
}

function updatePlayer() {
  if (player.dead) return;
  const speed = 4.5, accel = 0.6, friction = 0.82, gravity = 0.55, jumpForce = -11;

  if (player.dashCooldown > 0) player.dashCooldown--;
  if (player.shootCooldown > 0) player.shootCooldown--;

  const wantShoot = isShoot();
  if (wantShoot && !player.shootPressed && player.shootCooldown <= 0) {
    player.shootCooldown = player.shootCooldownMax; player.shootPressed = true;
    projectiles.push(new Projectile(player.x + player.facing * 16, player.y + player.h / 2 - 4, player.facing));
    spawnParticles(player.x + player.facing * 16, player.y + player.h / 2 - 4, COLORS.particleFire, 6, 3, 10, 3, 0);
    camera.shake = 2;
  }
  if (!wantShoot) player.shootPressed = false;

  const wantDash = isDash();
  if (wantDash && !player.dashPressed && player.dashCooldown <= 0 && !player.dashing) {
    player.dashing = true; player.dashTimer = player.dashDuration;
    player.dashCooldown = player.dashCooldownMax; player.dashPressed = true;
    let dashDir = player.facing;
    if (isLeft()) dashDir = -1; else if (isRight()) dashDir = 1;
    player.vx = player.dashSpeed * dashDir; player.vy = 0;
    spawnParticles(player.x, player.y + player.h / 2, COLORS.particleDash, 15, 5, 18, 4, 0);
    camera.shake = 4;
  }
  if (!wantDash) player.dashPressed = false;

  if (player.dashing) {
    player.dashTimer--;
    player.dashTrail.push({ x: player.x, y: player.y, life: 12, facing: player.facing });
    if (player.dashTimer % 2 === 0) spawnParticles(player.x, player.y + player.h / 2, COLORS.particleDash, 3, 2, 10, 3, 0);
    if (player.dashTimer <= 0) { player.dashing = false; player.vx *= 0.4; }
  } else {
    player.running = false;
    if (isLeft()) { player.vx -= accel; player.facing = -1; player.running = true; }
    if (isRight()) { player.vx += accel; player.facing = 1; player.running = true; }
    player.vx *= friction;
    if (Math.abs(player.vx) > speed) player.vx = speed * Math.sign(player.vx);
    if (Math.abs(player.vx) < 0.1) player.vx = 0;
    const wantJump = isJump();
    if (wantJump && !player.jumpPressed && player.jumps < player.maxJumps) {
      player.vy = jumpForce * (player.jumps === 1 ? 0.85 : 1);
      player.jumps++; player.jumpPressed = true;
      spawnParticles(player.x, player.y + player.h / 2, COLORS.particleJump, 6, 3, 15, 3, 0.1);
      if (player.jumps === 2) spawnParticles(player.x, player.y, COLORS.particleFire, 10, 4, 20, 4, 0.05);
    }
    if (!wantJump) player.jumpPressed = false;
    player.vy += gravity;
    if (player.vy > 15) player.vy = 15;
  }

  player.x += player.vx;
  const prevBottom = player.y + player.h;
  player.y += player.vy;

  player.onGround = false;
  for (const p of platforms) {
    if (p.destroyed) continue;
    if (player.vy >= 0) {
      const curBottom = player.y + player.h;
      const platTop = p.y;
      if (player.x + player.w / 2 > p.x && player.x - player.w / 2 < p.x + p.w) {
        if (prevBottom <= platTop + 2 && curBottom >= platTop) {
          player.y = platTop - player.h; player.vy = 0; player.onGround = true; player.jumps = 0;
          if (p.type === 'crumble' && !p.crumbling) p.crumbling = true;
        }
      }
    }
  }

  // Свечение при движении (упрощено в Lite версии)
  if (player.running && player.onGround) {
    player.animTimer++;
    if (player.animTimer > 6) { 
      player.animTimer = 0; 
      player.animFrame = (player.animFrame + 1) % 4; 
    }
    
    if (!isLiteVersion && player.animFrame % 2 === 0) {
      const glowX = player.x + (Math.random() - 0.5) * 20;
      const glowY = player.y + player.h + 2 + Math.random() * 4;
      player.glowParticles.push({
        x: glowX,
        y: glowY,
        life: 20 + Math.random() * 10,
        maxLife: 30,
        size: 6 + Math.random() * 8,
        alpha: 0.6 + Math.random() * 0.3
      });
      
      if (Math.random() < 0.3) {
        spawnParticles(
          player.x + (Math.random() - 0.5) * 16,
          player.y + player.h + 2,
          COLORS.particleFire,
          1, 1, 12, 2, 0.05
        );
      }
    }
  } else {
    player.animTimer = 0;
    player.animFrame = 0;
  }
  
  if (!isLiteVersion) {
    for (let i = player.glowParticles.length - 1; i >= 0; i--) {
      const g = player.glowParticles[i];
      g.life--;
      g.size *= 0.97;
      g.alpha *= 0.97;
      if (g.life <= 0 || g.size < 0.5) {
        player.glowParticles.splice(i, 1);
      }
    }
    if (player.glowParticles.length > 30) {
      player.glowParticles.splice(0, player.glowParticles.length - 30);
    }
  }

  if (player.invincible > 0) player.invincible--;
  player.trail.push({ x: player.x, y: player.y, life: 8 });
  if (player.trail.length > 8) player.trail.shift();
  for (let i = player.dashTrail.length - 1; i >= 0; i--) { player.dashTrail[i].life--; if (player.dashTrail[i].life <= 0) player.dashTrail.splice(i, 1); }
  if (player.y > 800) hurtPlayer(99);
}

function hurtPlayer(dmg) {
  if (player.invincible > 0 || player.dead) return;
  player.hp -= dmg; player.invincible = 60; camera.shake = 12;
  combo = 0;
  spawnParticles(player.x, player.y, COLORS.particleHurt, 15, 5, 25, 4, 0.1);
  if (player.hp <= 0) {
    player.dead = true;
    spawnParticles(player.x, player.y, COLORS.particleFire, 40, 7, 40, 5, 0.1);
    setTimeout(() => { 
      gameState = 'dead'; 
      // Сохраняем рекорд
      if (score > getBestScore()) {
        setBestScore(score);
        showToast('🏆 НОВЫЙ РЕКОРД! ' + score);
      }
      showOverlay('GAME OVER', 'Вы пали в тёмных землях', true); 
    }, 800);
  }
}

function drawPlayer() {
  if (player.dead) return;
  if (player.invincible > 0 && Math.floor(player.invincible / 3) % 2 === 0) return;

  // Рисуем свечение (только в Full версии)
  if (!isLiteVersion) {
    for (const g of player.glowParticles) {
      const sx = g.x - camera.x;
      const sy = g.y - camera.y;
      const alpha = (g.life / g.maxLife) * g.alpha;
      const size = g.size * (g.life / g.maxLife);
      
      ctx.globalAlpha = alpha * 0.3;
      const grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, size * 2.5);
      grad.addColorStop(0, '#ff6b2b');
      grad.addColorStop(0.5, '#ff8833');
      grad.addColorStop(1, 'rgba(255,107,43,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(sx, sy, size * 2.5, 0, Math.PI * 2); ctx.fill();
      
      ctx.globalAlpha = alpha * 0.7;
      const grad2 = ctx.createRadialGradient(sx, sy, 0, sx, sy, size);
      grad2.addColorStop(0, '#ffaa44');
      grad2.addColorStop(0.5, '#ff6b2b');
      grad2.addColorStop(1, 'rgba(255,107,43,0)');
      ctx.fillStyle = grad2;
      ctx.beginPath(); ctx.arc(sx, sy, size, 0, Math.PI * 2); ctx.fill();
      
      ctx.globalAlpha = 1;
    }
  }

  for (let i = 0; i < player.trail.length; i++) {
    const t = player.trail[i]; const alpha = (i / player.trail.length) * 0.15;
    ctx.globalAlpha = alpha; ctx.fillStyle = COLORS.playerBody;
    ctx.beginPath(); ctx.arc(t.x - camera.x, t.y + player.h / 2 - camera.y, 10, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  const sx = player.x - camera.x, sy = player.y - camera.y, f = player.facing;
  ctx.save(); ctx.translate(sx, sy + player.h / 2);

  ctx.globalAlpha = 0.2;
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(0, player.h / 2 + 2, 16, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;

  if (player.dashing) {
    ctx.globalAlpha = 0.3; ctx.fillStyle = COLORS.particleDash;
    ctx.beginPath(); ctx.ellipse(0, 0, 22, 24, 0, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
  }

  const bobY = player.onGround && player.running ? Math.sin(player.animFrame * Math.PI / 2) * 2 : 0;
  const squash = player.onGround ? 1 : (player.vy < 0 ? 0.9 : 1.1);
  const stretch = player.onGround ? 1 : (player.vy < 0 ? 1.15 : 0.9);
  ctx.scale(f, 1);

  ctx.fillStyle = COLORS.playerBody;
  ctx.beginPath(); ctx.ellipse(0, bobY, 12 * squash, 16 * stretch, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = COLORS.playerLight; ctx.globalAlpha = 0.35;
  ctx.beginPath(); ctx.ellipse(-3, -4 + bobY, 5 * squash, 8 * stretch, -0.2, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;

  ctx.globalAlpha = 0.15;
  ctx.fillStyle = '#ff6b2b';
  ctx.beginPath(); ctx.ellipse(0, bobY, 16 * squash, 20 * stretch, 0, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;

  ctx.fillStyle = COLORS.eye;
  ctx.beginPath(); ctx.ellipse(4, -5 + bobY, 5, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = COLORS.pupil;
  ctx.beginPath(); ctx.arc(5.5, -4 + bobY, 2.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(6.5, -6 + bobY, 1.2, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

let platforms = [];
class Platform {
  constructor(x, y, w, h, type) {
    this.x = x; this.y = y; this.w = w; this.h = h || 20;
    this.type = type || 'normal';
    this.moveRange = 0; this.moveSpeed = 0; this.movePhase = 0; this.origY = y;
    this.crumbleTimer = 0; this.crumbling = false; this.destroyed = false; this.respawnTimer = 0;
  }
  update() {
    if (this.type === 'moving') { this.movePhase += this.moveSpeed; this.y = this.origY + Math.sin(this.movePhase) * this.moveRange; }
    if (this.type === 'crumble' && this.crumbling) {
      this.crumbleTimer++;
      if (this.crumbleTimer > 30 && !this.destroyed) {
        spawnParticles(this.x + this.w / 2, this.y + this.h / 2, COLORS.platformEdge, 8, 3, 20, 3, 0.2);
        this.destroyed = true; this.respawnTimer = 180;
      }
    }
    if (this.destroyed) { this.respawnTimer--; if (this.respawnTimer <= 0) { this.destroyed = false; this.crumbling = false; this.crumbleTimer = 0; } }
  }
  draw() {
    if (this.destroyed) return;
    const sx = this.x - camera.x, sy = this.y - camera.y;
    if (sx + this.w < -50 || sx > W + 50) return;
    ctx.fillStyle = COLORS.platform; ctx.fillRect(sx, sy, this.w, this.h);
    const gradient = ctx.createLinearGradient(sx, sy, sx, sy + 6);
    if (this.type === 'moving') { gradient.addColorStop(0, '#5a7d9a'); gradient.addColorStop(1, '#3d5a70'); }
    else if (this.type === 'crumble') {
      const alpha = this.crumbling ? Math.max(0, 1 - this.crumbleTimer / 30) : 1;
      ctx.globalAlpha = alpha; gradient.addColorStop(0, '#8b6e4e'); gradient.addColorStop(1, '#6b5234');
    } else { gradient.addColorStop(0, COLORS.platformTop); gradient.addColorStop(1, COLORS.platform); }
    ctx.fillStyle = gradient; ctx.fillRect(sx, sy, this.w, 6);
    if (this.type === 'normal' && this.w > 40) {
      ctx.fillStyle = COLORS.grass;
      for (let gx = sx + 5; gx < sx + this.w - 5; gx += 8 + Math.random() * 4) { const gh = 3 + Math.random() * 4; ctx.fillRect(gx, sy - gh, 2, gh); }
    }
    ctx.fillStyle = COLORS.platformEdge;
    const prevAlpha = ctx.globalAlpha; ctx.globalAlpha = Math.min(prevAlpha, 0.3);
    ctx.fillRect(sx, sy, this.w, 2); ctx.globalAlpha = prevAlpha;
  }
}

    ctx.beginPath(); ctx.arc(sx, sy, 16, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
    const scaleX = Math.abs(Math.cos(this.phase * 1.5)); ctx.fillStyle = COLORS.coin; ctx.beginPath();
    ctx.ellipse(sx, sy, Math.max(1, this.radius * scaleX), this.radius, 0, 0, Math.PI * 2); ctx.fill();

let healthPickups = [];

function drawHeartShape(x, y, size) {
  const s = size / 16;
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath(); ctx.moveTo(0, 4); ctx.bezierCurveTo(-8, -4, -16, 2, -8, 10); ctx.lineTo(0, 16); ctx.lineTo(8, 10); ctx.bezierCurveTo(16, 2, 8, -4, 0, 4); ctx.closePath(); ctx.fill();
  ctx.restore();
}

let enemies = [];
class Enemy {
  constructor(x, y, type, patrolDist, boundPlatform) {
    this.x = x; this.y = y; this.type = type; this.patrolDist = patrolDist || 80;
    this.origX = x; this.origY = y; this.dir = Math.random() > 0.5 ? 1 : -1;
    this.phase = Math.random() * Math.PI * 2;
    this.speed = type === 'bat' ? 1.5 : (type === 'slime' ? 0.8 : 0);
    this.w = type === 'spikes' ? 30 : 24;
    this.h = type === 'spikes' ? 16 : (type === 'bat' ? 20 : 22);
    this.alive = true; this.animFrame = 0; this.boundPlatform = boundPlatform || null;
  }
  update() {
    if (!this.alive) return; this.phase += 0.05; this.animFrame++;
    if (this.type === 'slime') {
      this.x += this.speed * this.dir;
      if (this.boundPlatform) { const bp = this.boundPlatform; if (this.x < bp.x + 15) { this.x = bp.x + 15; this.dir = 1; } if (this.x > bp.x + bp.w - 15) { this.x = bp.x + bp.w - 15; this.dir = -1; } }
      else { if (this.x > this.origX + this.patrolDist || this.x < this.origX - this.patrolDist) this.dir *= -1; }
    } else if (this.type === 'bat') {
      this.x += this.speed * this.dir; this.y = this.origY + Math.sin(this.phase * 2) * 15;
      if (this.x > this.origX + this.patrolDist * 1.5 || this.x < this.origX - this.patrolDist * 1.5) this.dir *= -1;
    }
    if (player.dead || player.invincible > 0) return;
    const dx = player.x - this.x, dy = (player.y + player.h / 2) - this.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 22) {
      if (player.dashing) {
        this.alive = false; score += 25;
        combo++;
        if (combo > maxCombo) maxCombo = combo;
        spawnParticles(this.x, this.y, this.type === 'slime' ? COLORS.enemySlime : COLORS.enemyBat, 15, 5, 25, 4, 0.15);
        return;
      }
      if (player.vy > 0 && player.y + player.h - 8 < this.y && this.type !== 'spikes') {
        this.alive = false; player.vy = -8; score += 25;
        combo++;
        if (combo > maxCombo) maxCombo = combo;
        spawnParticles(this.x, this.y, this.type === 'slime' ? COLORS.enemySlime : COLORS.enemyBat, 15, 5, 25, 4, 0.15);
      } else { hurtPlayer(1); player.vx = -Math.sign(dx) * 5; player.vy = -6; }
    }
  }
  draw() {
    if (!this.alive) return;
    const sx = this.x - camera.x, sy = this.y - camera.y;
    if (sx < -40 || sx > W + 40) return;
    ctx.save(); ctx.translate(sx, sy);
    if (this.type === 'slime') {
      const squish = 1 + Math.sin(this.animFrame * 0.15) * 0.1; ctx.scale(this.dir, 1);
      ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(0, 10, 14, 4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = COLORS.enemySlime; ctx.beginPath(); ctx.ellipse(0, 0, 14 / squish, 12 * squish, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = COLORS.enemySlimeDark; ctx.beginPath(); ctx.ellipse(0, 4, 12 / squish, 6 * squish, 0, 0, Math.PI); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(4, -3, 5, 5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1a1a2e'; ctx.beginPath(); ctx.arc(5, -2, 2.5, 0, Math.PI * 2); ctx.fill();
    } else if (this.type === 'bat') {
      const wingAngle = Math.sin(this.animFrame * 0.3) * 0.5; ctx.scale(this.dir, 1);
      ctx.fillStyle = COLORS.enemyBatDark;
      ctx.save(); ctx.rotate(-wingAngle); ctx.beginPath(); ctx.ellipse(-10, -2, 12, 5, -0.3, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      ctx.save(); ctx.rotate(wingAngle); ctx.beginPath(); ctx.ellipse(10, -2, 12, 5, 0.3, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      ctx.fillStyle = COLORS.enemyBat; ctx.beginPath(); ctx.ellipse(0, 0, 8, 10, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ff4444'; ctx.beginPath(); ctx.arc(-3, -3, 2, 0, Math.PI * 2); ctx.arc(3, -3, 2, 0, Math.PI * 2); ctx.fill();
    } else if (this.type === 'spikes') {
      ctx.fillStyle = COLORS.enemySpikes; const spikeCount = 4; const sw = this.w / spikeCount;
      for (let i = 0; i < spikeCount; i++) { ctx.beginPath(); ctx.moveTo(i * sw, 8); ctx.lineTo(i * sw + sw / 2, -8); ctx.lineTo((i + 1) * sw, 8); ctx.closePath(); ctx.fill(); }
      ctx.fillStyle = '#666'; ctx.fillRect(-2, 6, this.w + 4, 6);
    }
    ctx.restore();
  }
}

let generatedUpTo = 0;
function generateChunk(startX) {
  const difficulty = Math.min(startX / 8000, 1);
  const islandCount = 2 + Math.floor(Math.random() * 2);
  let cursorX = startX;
  for (let i = 0; i < islandCount; i++) {
    const isLarge = Math.random() < 0.6;
    const platW = isLarge ? (120 + Math.random() * 140) : (60 + Math.random() * 60);
    const platY = 280 + Math.random() * 120;
    let platType = 'normal';
    if (difficulty > 0.3 && Math.random() < difficulty * 0.2) platType = 'moving';
    else if (difficulty > 0.5 && Math.random() < (difficulty - 0.5) * 0.3) platType = 'crumble';
    const plat = new Platform(cursorX, platY, platW, 20, platType);
    if (platType === 'moving') { plat.moveRange = 25 + Math.random() * 35; plat.moveSpeed = 0.02 + Math.random() * 0.02; }
    platforms.push(plat);

    if (platW >= 80 && Math.random() < 0.7) {
      const coinCount = 1 + Math.floor(Math.random() * Math.min(4, Math.floor(platW / 35)));
      const spacing = platW / (coinCount + 1);
      for (let c = 0; c < coinCount; c++) coinList.push(new Coin(plat.x + spacing * (c + 1), plat.y - 22));
    } else if (Math.random() < 0.3) { coinList.push(new Coin(plat.x + platW / 2, plat.y - 22)); }

    if (Math.random() < 0.12) {
      const hpOffsetX = (Math.random() - 0.5) * (platW * 0.6);
      healthPickups.push(new HealthPickup(plat.x + platW / 2 + hpOffsetX, plat.y - 26));
    }

    if (platW > 90 && Math.random() < 0.3 + difficulty * 0.25) {
      const enemyType = Math.random() < 0.75 ? 'slime' : 'spikes';
      if (enemyType === 'slime') enemies.push(new Enemy(plat.x + platW / 2, plat.y - 14, 'slime', platW / 2 - 20, plat));
      else enemies.push(new Enemy(plat.x + platW / 2, plat.y - 8, 'spikes'));
    }
    if (Math.random() < 0.15 + difficulty * 0.2) enemies.push(new Enemy(cursorX + platW / 2, 150 + Math.random() * 100, 'bat', 60 + Math.random() * 50));

    if (platW > 120 && Math.random() < 0.25) {
      const arcX = plat.x + platW / 2 - 50;
      for (let a = 0; a < 5; a++) coinList.push(new Coin(arcX + a * 25, plat.y - 30 - Math.sin(a / 4 * Math.PI) * 50));
    }

    if (i < islandCount - 1) {
      const gap = 80 + Math.random() * 80; const stepH = -40 + Math.random() * 80;
      const stepW = 50 + Math.random() * 40; const clampedStepY = Math.max(180, Math.min(400, platY + stepH));
      platforms.push(new Platform(cursorX + platW + gap / 2 - stepW / 2, clampedStepY, stepW, 16, 'normal'));
      if (Math.random() < 0.4) coinList.push(new Coin(cursorX + platW + gap / 2, clampedStepY - 22));
      cursorX = cursorX + platW + gap;
    } else { cursorX = cursorX + platW + 60; }
  }
  generatedUpTo = cursorX + 100;
}

function cleanupOffscreen() {
  const cleanX = camera.x - 800;
  platforms = platforms.filter(p => p.x + p.w > cleanX);
  coinList = coinList.filter(c => c.x > cleanX);
  healthPickups = healthPickups.filter(h => !h.collected && h.x > cleanX);
  enemies = enemies.filter(e => e.x > cleanX - 100);
  particles = particles.filter(p => p.life > 0);
  projectiles = projectiles.filter(p => p.life > 0 && p.x > cleanX);
}

// ===================== ФОН =====================
const mountains1 = [], mountains2 = [];
for (let i = 0; i < 40; i++) {
  mountains1.push({ x: i * 200 - 500, h: 80 + Math.random() * 120, w: 150 + Math.random() * 100 });
  mountains2.push({ x: i * 180 - 300, h: 60 + Math.random() * 80, w: 120 + Math.random() * 80 });
}
const stars = [];
for (let i = 0; i < 120; i++) stars.push({ x: Math.random() * W * 3, y: Math.random() * H * 0.6, size: 0.5 + Math.random() * 1.5, twinkle: Math.random() * Math.PI * 2, speed: 0.5 + Math.random() * 2 });
let bgTime = 0;

function drawBackground() {
  bgTime += 0.01;
  
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  
  if (isLiteVersion) {
    // Упрощённый градиент для Lite версии
    skyGrad.addColorStop(0, '#0d1117');
    skyGrad.addColorStop(0.4, '#1a1a2e');
    skyGrad.addColorStop(0.7, '#2d1b3d');
    skyGrad.addColorStop(0.85, '#5c2744');
    skyGrad.addColorStop(0.95, '#c44536');
    skyGrad.addColorStop(1, '#ff6b2b');
  } else {
    // Полная палитра заката для Full версии
    const colors = [
      '#0d1117', '#1a0a2e', '#2d1b3d', '#5c2744', '#8a2a4a',
      '#c44536', '#ff6b2b', '#ff8833', '#ffaa44', '#ffcc55'
    ];
    for (let i = 0; i < colors.length; i++) {
      const pos = i / (colors.length - 1);
      const offset = Math.sin(pos * Math.PI * 2 + bgTime * 0.05) * 0.02;
      skyGrad.addColorStop(Math.max(0, Math.min(1, pos + offset)), colors[i]);
    }
  }
  
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);
  
  // Сияние на горизонте (только в Full версии)
  if (!isLiteVersion) {
    const horizonGlow = ctx.createRadialGradient(W / 2, H * 0.85, 0, W / 2, H * 0.85, H * 0.5);
    horizonGlow.addColorStop(0, `rgba(255, 200, 80, ${0.15 + Math.sin(bgTime * 0.03) * 0.05})`);
    horizonGlow.addColorStop(0.5, `rgba(255, 100, 50, ${0.1 + Math.sin(bgTime * 0.04 + 1) * 0.03})`);
    horizonGlow.addColorStop(1, 'rgba(255, 50, 20, 0)');
    ctx.fillStyle = horizonGlow;
    ctx.fillRect(0, 0, W, H);
  }
  
  // Звёзды
  for (const s of stars) {
    const sx = ((s.x - camera.x * 0.02) % (W * 1.5) + W * 1.5) % (W * 1.5);
    const starAlpha = 0.4 + Math.sin(bgTime * s.speed + s.twinkle) * 0.3;
    const heightFactor = 1 - (s.y / (H * 0.6));
    ctx.globalAlpha = starAlpha * heightFactor;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(sx, s.y, s.size, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  
  // Горы
  const m1Offset = camera.x * 0.1;
  ctx.fillStyle = COLORS.mountain1;
  for (const m of mountains1) {
    const adjusted = (((m.x - m1Offset) % 8000) + 8000) % 8000 - 500;
    ctx.beginPath();
    ctx.moveTo(adjusted, H);
    ctx.lineTo(adjusted + m.w / 2, H - m.h);
    ctx.lineTo(adjusted + m.w, H);
    ctx.closePath();
    ctx.fill();
  }
  
  const m2Offset = camera.x * 0.25;
  ctx.fillStyle = COLORS.mountain2;
  for (const m of mountains2) {
    const adjusted = (((m.x - m2Offset) % 7200) + 7200) % 7200 - 300;
    ctx.beginPath();
    ctx.moveTo(adjusted, H);
    ctx.lineTo(adjusted + m.w / 2, H - m.h);
    ctx.lineTo(adjusted + m.w, H);
    ctx.closePath();
    ctx.fill();
  }
  
  // Атмосферное свечение (только в Full версии)
  if (!isLiteVersion) {
    ctx.globalAlpha = 0.1 + Math.sin(bgTime) * 0.03;
    const glowGrad = ctx.createRadialGradient(W / 2, H * 0.8, 0, W / 2, H * 0.8, H);
    glowGrad.addColorStop(0, '#ff8833');
    glowGrad.addColorStop(0.3, '#ff6b2b');
    glowGrad.addColorStop(0.7, '#cc3377');
    glowGrad.addColorStop(1, 'rgba(255,107,43,0)');
    ctx.fillStyle = glowGrad;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
}

const fireflies = [];
for (let i = 0; i < 25; i++) fireflies.push({ x: Math.random() * W * 4, y: 100 + Math.random() * 350, phase: Math.random() * Math.PI * 2, speed: 0.3 + Math.random() * 0.7, size: 1.5 + Math.random() * 2 });
function drawFireflies() {
  if (isLiteVersion) return;
  for (const f of fireflies) {
    f.phase += 0.03;
    const fx = ((f.x - camera.x * 0.4 + Math.sin(f.phase) * 30) % (W * 2) + W * 2) % (W * 2);
    const fy = f.y + Math.cos(f.phase * 0.7) * 20;
    const alpha = 0.3 + Math.sin(f.phase * f.speed) * 0.3;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#ffc857';
    ctx.beginPath(); ctx.arc(fx, fy, f.size, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = alpha * 0.3;
    ctx.beginPath(); ctx.arc(fx, fy, f.size * 4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ===================== HUD =====================
function drawHUD() {
  const heartSize = 18;
  for (let i = 0; i < player.maxHp; i++) {
    ctx.fillStyle = i < player.hp ? COLORS.healthFull : COLORS.healthEmpty;
    drawHeart(16 + i * (heartSize + 6), 20, heartSize);
  }

  const dashReady = player.dashCooldown <= 0;
  const dashX = 16, dashY = 48;
  ctx.fillStyle = dashReady ? COLORS.particleDash : COLORS.healthEmpty;
  ctx.beginPath();
  ctx.moveTo(dashX + 6, dashY); ctx.lineTo(dashX, dashY + 10);
  ctx.lineTo(dashX + 5, dashY + 10); ctx.lineTo(dashX + 1, dashY + 20);
  ctx.lineTo(dashX + 10, dashY + 7); ctx.lineTo(dashX + 5, dashY + 7);
  ctx.lineTo(dashX + 9, dashY); ctx.closePath(); ctx.fill();
  if (!dashReady) {
    const progress = 1 - (player.dashCooldown / player.dashCooldownMax);
    ctx.fillStyle = 'rgba(46,196,178,0.3)'; ctx.fillRect(dashX + 16, dashY + 2, 40, 6);
    ctx.fillStyle = COLORS.particleDash; ctx.fillRect(dashX + 16, dashY + 2, 40 * progress, 6);
  } else {
    ctx.fillStyle = COLORS.particleDash; ctx.font = '700 12px Nunito'; ctx.textAlign = 'left';
    ctx.fillText('SHIFT', dashX + 16, dashY + 10);
  }

  const shootReady = player.shootCooldown <= 0;
  const shootX = 16, shootY = 76;
  ctx.fillStyle = shootReady ? '#e63946' : COLORS.healthEmpty;
  ctx.beginPath(); ctx.arc(shootX + 6, shootY + 8, 7, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = shootReady ? '#ffaa33' : '#555';
  ctx.beginPath(); ctx.arc(shootX + 6, shootY + 8, 4, 0, Math.PI * 2); ctx.fill();
  if (!shootReady) {
    const progress = 1 - (player.shootCooldown / player.shootCooldownMax);
    ctx.fillStyle = 'rgba(230,57,70,0.3)'; ctx.fillRect(shootX + 16, shootY + 4, 40, 6);
    ctx.fillStyle = '#e63946'; ctx.fillRect(shootX + 16, shootY + 4, 40 * progress, 6);
  } else {
    ctx.fillStyle = '#e63946'; ctx.font = '700 12px Nunito'; ctx.textAlign = 'left';
    ctx.fillText('FIRE [F]', shootX + 16, shootY + 12);
  }

  if (combo > 0) {
    ctx.fillStyle = '#ffc857';
    ctx.font = '900 18px Russo One';
    ctx.textAlign = 'left';
    ctx.fillText(`🔥 x${Math.floor(combo/5)+1}`, 16, shootY + 44);
  }

  ctx.fillStyle = COLORS.coin; ctx.beginPath(); ctx.arc(W - 120, 26, 10, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = COLORS.coinShine; ctx.beginPath(); ctx.arc(W - 122, 24, 3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = COLORS.text; ctx.font = '900 20px Nunito'; ctx.textAlign = 'left'; ctx.fillText(coins, W - 104, 33);
  ctx.fillStyle = COLORS.accent2; ctx.font = '900 18px Russo One'; ctx.textAlign = 'right'; ctx.fillText('SCORE: ' + score, W - 16, 33);
  ctx.fillStyle = 'rgba(240,230,211,0.5)'; ctx.font = '400 14px Nunito'; ctx.fillText(Math.floor(distance) + 'm', W - 16, 52);
  
  // Индикатор версии
  if (isLiteVersion) {
    ctx.fillStyle = 'rgba(240,230,211,0.2)';
    ctx.font = '400 10px Nunito';
    ctx.textAlign = 'left';
    ctx.fillText('Lite', 16, H - 10);
  }
}
function drawHeart(x, y, size) { drawHeartShape(x, y, size); }

// ===================== ОВЕРЛЕЙ =====================
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlayTitle');
const overlaySubtitle = document.getElementById('overlaySubtitle');
const overlayStats = document.getElementById('overlayStats');
const startBtn = document.getElementById('startBtn');

function showOverlay(title, subtitle, showStats) {
  overlayTitle.textContent = title; overlaySubtitle.textContent = subtitle;
  if (showStats) { 
    overlayStats.style.display = 'block'; 
    const currentBest = getBestScore();
    overlayStats.textContent = 'Очки: ' + score + ' | Монеты: ' + coins + ' | Дистанция: ' + Math.floor(distance) + 'м | Макс. комбо: x' + (Math.floor(maxCombo/5)+1) + ' | Рекорд: ' + currentBest;
  }
  else overlayStats.style.display = 'none';
  overlay.classList.remove('hidden');
}
function hideOverlay() { overlay.classList.add('hidden'); }

startBtn.addEventListener('click', () => {
  enterFullscreen();
  startGame();
});

function startGame() {
  platforms = []; coinList = []; enemies = []; particles = []; projectiles = []; healthPickups = [];
  generatedUpTo = 0; score = 0; coins = 0; distance = 0; camera.x = 0; camera.y = 0; camera.shake = 0;
  resetPlayer();
  platforms.push(new Platform(100, 380, 300, 30, 'normal'));
  coinList.push(new Coin(200, 358)); coinList.push(new Coin(240, 358)); coinList.push(new Coin(280, 358));
  for (let i = 0; i < 5; i++) generateChunk(generatedUpTo);
  gameState = 'playing'; hideOverlay(); pauseOverlay.classList.add('hidden');
}

// ===================== ОТРИСОВКА ЗАМОРОЖЕННОГО КАДРА =====================
function drawFrozenFrame() {
  ctx.save(); const shake = getShakeOffset(); ctx.translate(shake.x, shake.y);
  drawBackground();
  drawFloatingParticles();
  drawFireflies();
  for (const p of platforms) p.draw();
  for (const c of coinList) c.draw();
  for (const h of healthPickups) h.draw();
  for (const e of enemies) e.draw();
  for (const p of projectiles) p.draw();
  drawPlayer();
  for (const p of particles) p.draw();
  ctx.restore();
  drawHUD();
}

// ===================== ИГРОВОЙ ЦИКЛ =====================
function gameLoop() {
  requestAnimationFrame(gameLoop);

  if (gameState === 'paused') {
    drawFrozenFrame();
    return;
  }

  if (gameState !== 'playing') { drawBackground(); return; }

  updatePlayer();
  updateFloatingParticles();
  
  const newDist = (player.x - 200) / 50;
  if (newDist > distance) distance = newDist;
  score = Math.max(score, coins * 10 + Math.floor(distance) * 2);

  while (generatedUpTo < player.x + W * 2) generateChunk(generatedUpTo);
  for (const p of platforms) p.update();
  for (const c of coinList) c.update();
  for (const h of healthPickups) h.update();
  for (const e of enemies) e.update();
  for (const p of projectiles) p.update();
  for (let i = particles.length - 1; i >= 0; i--) { particles[i].update(); if (particles[i].life <= 0) particles.splice(i, 1); }

  cleanupOffscreen(); updateCamera(player);

  ctx.save(); const shake = getShakeOffset(); ctx.translate(shake.x, shake.y);
  drawBackground();
  drawFloatingParticles();
  drawFireflies();
  for (const p of platforms) p.draw();
  for (const c of coinList) c.draw();
  for (const h of healthPickups) h.draw();
  for (const e of enemies) e.draw();
  for (const p of projectiles) p.draw();
  drawPlayer();
  for (const p of particles) p.draw();
  ctx.restore();
  drawHUD();
}

showOverlay('Amber RUN', 'Процедурный платформер', false);
gameLoop();
</script>
